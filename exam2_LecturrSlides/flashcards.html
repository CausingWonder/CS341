<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Structures Exam 2 Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .btn-category {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-category.active {
            background: white;
            color: #667eea;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-front {
            background: white;
            color: #333;
        }

        .card-back {
            background: #4CAF50;
            color: white;
            transform: rotateY(180deg);
        }

        .card-content {
            font-size: 1.3em;
            line-height: 1.6;
            overflow-y: auto;
            max-height: 100%;
            width: 100%;
        }

        .card-label {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.1);
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .card-back .card-label {
            background: rgba(255,255,255,0.2);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 20px;
            width: 100%;
            max-width: 700px;
        }

        .nav-btn {
            padding: 15px 30px;
            background: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            color: #667eea;
        }

        .nav-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .progress {
            text-align: center;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
        }

        .category-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tag {
            padding: 6px 14px;
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
            font-size: 0.85em;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tag:hover {
            background: rgba(255,255,255,0.5);
        }

        .stats {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            color: white;
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        .stats h3 {
            margin-bottom: 10px;
        }

        ul {
            list-style-position: inside;
            text-align: left;
        }

        li {
            margin: 5px 0;
        }

        code {
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .card-back code {
            background: rgba(255,255,255,0.2);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .card {
                height: 450px;
            }

            .card-face {
                padding: 25px;
            }

            .card-content {
                font-size: 1.1em;
            }

            .navigation {
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 Data Structures Exam 2</h1>
        <p>Interactive Flashcards</p>
    </div>

    <div class="category-tags" id="categoryTags"></div>

    <div class="controls">
        <button class="btn btn-primary" onclick="shuffleCards()">🔀 Shuffle</button>
        <button class="btn btn-primary" onclick="resetProgress()">🔄 Reset</button>
        <button class="btn btn-primary" onclick="toggleStats()">📊 Stats</button>
    </div>

    <div class="card-container">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card-face card-front">
                <div class="card-label">Question</div>
                <div class="card-content" id="question"></div>
            </div>
            <div class="card-face card-back">
                <div class="card-label">Answer</div>
                <div class="card-content" id="answer"></div>
            </div>
        </div>
    </div>

    <div class="navigation">
        <button class="nav-btn" onclick="previousCard()" id="prevBtn">← Previous</button>
        <div class="progress" id="progress"></div>
        <button class="nav-btn" onclick="nextCard()" id="nextBtn">Next →</button>
    </div>

    <div class="stats" id="stats" style="display: none;">
        <h3>Progress Statistics</h3>
        <p id="statsContent"></p>
    </div>

    <script>
        const flashcards = [
            // Linked Lists
            {
                question: "What are the 2 entry points to a linked list?",
                answer: "Head and Tail",
                category: "Linked Lists"
            },
            {
                question: "T/F: Lists are more expensive in terms of size to maintain than an array?",
                answer: "False",
                category: "Linked Lists"
            },
            {
                question: "What are the two key pieces of info that all link based implementations need?",
                answer: "Data and Link",
                category: "Linked Lists"
            },
            {
                question: "What are Nodes in a linked list?",
                answer: "Storage units which are linked together to create 'chains'",
                category: "Linked Lists"
            },
            {
                question: "What is the time complexity for traversal/searching in a linked list?",
                answer: "O(n)",
                category: "Linked Lists"
            },

            // Binary Search Trees
            {
                question: "What are the 3 rules of a BST?",
                answer: "<ul><li>Everything in the left subtree must be less than the root</li><li>Everything in the right subtree must be greater than the root</li><li>Both the left and right subtree must be BST</li></ul>",
                category: "Binary Trees"
            },
            {
                question: "T/F: If a tree is empty, it is considered a full tree?",
                answer: "True",
                category: "Binary Trees"
            },
            {
                question: "How many nodes are there in a BST with height 4?",
                answer: "2^4 - 1 = 15 nodes",
                category: "Binary Trees"
            },
            {
                question: "What are the 3 different conditions for removal of a node in a BST?",
                answer: "<ul><li>If no children, then remove</li><li>If 1 child, remove and replace with the child</li><li>If 2 children, replace with inorder successor</li></ul>",
                category: "Binary Trees"
            },
            {
                question: "T/F: When performing deletion of a node with 2 children, we use inorder traversal?",
                answer: "True",
                category: "Binary Trees"
            },
            {
                question: "What is a Full Binary Tree?",
                answer: "A tree of height h where all nodes at level less than h have two children each. A full binary tree of height h ≥ 0 has 2^h - 1 nodes.",
                category: "Binary Trees"
            },
            {
                question: "What is a Complete Binary Tree?",
                answer: "A binary tree that is full down to level h-1, with level h filled in from left to right. All nodes at level h-2 and above have two children each.",
                category: "Binary Trees"
            },
            {
                question: "What is a Fully Balanced tree?",
                answer: "A tree where the height of any node's right subtree differs from the height of the node's left subtree by no more than 1.",
                category: "Binary Trees"
            },
            {
                question: "What is the maximum number of nodes that a binary tree of height h can have?",
                answer: "2^h - 1",
                category: "Binary Trees"
            },

            // Red-Black Trees
            {
                question: "What color is the root in a Red-Black tree?",
                answer: "Black",
                category: "Red-Black Trees"
            },
            {
                question: "What are the 6 rules for Red-Black Trees?",
                answer: "<ul><li>Must be a BST</li><li>The root must be black</li><li>Every node when inserted begins as red</li><li>If a node is red, its children must be black</li><li>Every path from a node to nullptr must contain the same number of black nodes</li><li>Every nullptr leaf must be black</li></ul>",
                category: "Red-Black Trees"
            },
            {
                question: "What type of tree is a Red-Black tree?",
                answer: "A type of balanced Binary Search Tree (BST)",
                category: "Red-Black Trees"
            },
            {
                question: "What color does every node begin as when inserted into a Red-Black tree?",
                answer: "Red (Rule #3)",
                category: "Red-Black Trees"
            },
            {
                question: "If a node is Red in a Red-Black tree, what must be true about its children?",
                answer: "Its children must be Black",
                category: "Red-Black Trees"
            },
            {
                question: "Why is balance important in Red-Black trees?",
                answer: "Balance allows for optimal search, insertion, and deletion times. Most BST operations are O(h), but worst case is O(n) when the tree is unbalanced.",
                category: "Red-Black Trees"
            },
            {
                question: "What is a Left Rotation in Red-Black trees?",
                answer: "Repositions Node y as the root of the subtree. Assumes the right child of Node x is not nullptr.",
                category: "Red-Black Trees"
            },
            {
                question: "What is a Right Rotation in Red-Black trees?",
                answer: "Repositions Node x as the root of the subtree. Assumes the left child of Node y is not nullptr.",
                category: "Red-Black Trees"
            },
            {
                question: "What is the time complexity of most BST operations in Red-Black trees?",
                answer: "O(h) where h is the height. In balanced state, this is O(log n).",
                category: "Red-Black Trees"
            },

            // Hash Tables - General
            {
                question: "If you have key 5 and hash table of size 6, what will it hash to?",
                answer: "Bucket 5, the last one (5 % 6 = 5)",
                category: "Hash Tables"
            },
            {
                question: "T/F: A perfect hash function locates each key to a unique location?",
                answer: "True",
                category: "Hash Tables"
            },
            {
                question: "When 2 or more keys map to the same location, what is it called?",
                answer: "Collision",
                category: "Hash Tables"
            },
            {
                question: "How is load factor calculated in hashing? The equation?",
                answer: "Load Factor = # of keys / table size (or entry_count / size)",
                category: "Hash Tables"
            },
            {
                question: "What is the general hash function formula?",
                answer: "<code>hash = key % size</code>",
                category: "Hash Tables"
            },
            {
                question: "What is a perfect hash function?",
                answer: "A function that maps each search key into a unique location of the hash table. Only possible if you know all search keys in advance.",
                category: "Hash Tables"
            },
            {
                question: "What does a hash table store elements in?",
                answer: "Buckets",
                category: "Hash Tables"
            },

            // Linear Probing
            {
                question: "Provide an example of an open addressing collision scheme",
                answer: "Linear probing, Quadratic probing, Double hashing",
                category: "Hash Tables"
            },
            {
                question: "What is the hash formula for linear probing?",
                answer: "<code>hash = (key % size) + n</code><br>where n is the number of attempts",
                category: "Hash Tables"
            },
            {
                question: "What is the number 1 downside of linear probing?",
                answer: "Primary clustering - entries tend to cluster together, leading to long probe searches",
                category: "Hash Tables"
            },
            {
                question: "What are the three status states in linear probing?",
                answer: "<ul><li><b>Occupied:</b> Position currently held by an entry</li><li><b>Empty:</b> Position never used</li><li><b>Removed:</b> Position previously held an entry but is now available</li></ul>",
                category: "Hash Tables"
            },
            {
                question: "In linear probing, describe the Insert(x) operation",
                answer: "Keep probing until an empty slot is found. Once found, insert the key.",
                category: "Hash Tables"
            },
            {
                question: "In linear probing, describe the Search(x) operation",
                answer: "Keep probing until the slot's key becomes equal to x or an empty slot is reached.",
                category: "Hash Tables"
            },
            {
                question: "In linear probing, describe the Delete(k) operation",
                answer: "Keep probing until the key's slot is found and remove the key. Mark as REMOVED, not EMPTY.",
                category: "Hash Tables"
            },

            // Quadratic Probing
            {
                question: "What is the hash formula for quadratic probing?",
                answer: "<code>hash = (key % size) + n²</code><br>where n starts at 0 and increases by 1 for each collision",
                category: "Hash Tables"
            },
            {
                question: "What is the downside of quadratic probing?",
                answer: "Secondary clustering - when two search keys hash into the same location, they use the same probe sequence.",
                category: "Hash Tables"
            },

            // Double Hashing
            {
                question: "What is the formula for the second hash function in double hashing?",
                answer: "<code>hash2(x) = (size/2) - (x % (size/2))</code>",
                category: "Hash Tables"
            },
            {
                question: "How does double hashing work?",
                answer: "It applies a second hash function to the key when a collision occurs, providing a different probe sequence.",
                category: "Hash Tables"
            },

            // Separate Chaining
            {
                question: "T/F: Separate chaining is an example of closed addressing scheme?",
                answer: "True",
                category: "Hash Tables"
            },
            {
                question: "What is the time complexity of a singularly linked list in terms of separate chaining?",
                answer: "O(n)",
                category: "Hash Tables"
            },
            {
                question: "What is the time complexity of a doubly linked list in separate chaining?",
                answer: "O(1) for deletions (because we have backward links)",
                category: "Hash Tables"
            },
            {
                question: "How does separate chaining work?",
                answer: "It avoids collisions by chaining entries together within a given bucket. When a collision occurs, the new entry is appended to the list at that bucket.",
                category: "Hash Tables"
            },
            {
                question: "Why is doubly linked list better than singly linked list for separate chaining?",
                answer: "With doubly linked lists, we don't need to iterate back through the list to find the previous node when deleting. We already have the link back, giving O(1) time complexity instead of O(n).",
                category: "Hash Tables"
            },

            // Cuckoo Hashing
            {
                question: "What is the time complexity of Cuckoo Hashing in worst case?",
                answer: "O(1) - guarantees worst case lookup time",
                category: "Hash Tables"
            },
            {
                question: "What are the two hash functions used in Cuckoo Hashing?",
                answer: "<code>h1(key) = key % SIZE</code><br><code>h2(key) = (key / SIZE) % SIZE</code>",
                category: "Hash Tables"
            },
            {
                question: "What is the load factor formula for Cuckoo Hashing?",
                answer: "<code>Load Factor = entry_count / size</code>",
                category: "Hash Tables"
            },
            {
                question: "How does Cuckoo Hashing handle collisions (relocations)?",
                answer: "It pushes the current value to the other hashing table when collision occurs. If alternative position is vacant, insert. Otherwise, the former key displaces the key at that position.",
                category: "Hash Tables"
            },
            {
                question: "What is a cycle in Cuckoo Hashing?",
                answer: "When no open buckets exist for all of the hashing functions. This requires rehashing the entire data structure.",
                category: "Hash Tables"
            },
            {
                question: "Why is Cuckoo Hashing named after the Cuckoo bird?",
                answer: "The Cuckoo bird 'takes over' other birds' nests and removes eggs/babies to make room for their own - similar to how this hashing displaces existing values.",
                category: "Hash Tables"
            },
            {
                question: "What is the insertion time complexity for Cuckoo Hashing?",
                answer: "O(1) - as long as the number of keys is kept below half of the capacity (no cycles)",
                category: "Hash Tables"
            },
            {
                question: "What is the deletion time complexity for Cuckoo Hashing?",
                answer: "O(1) - just requires inspection of two locations in the hash table",
                category: "Hash Tables"
            }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let filteredCards = [...flashcards];
        let viewedCards = new Set();
        let currentCategory = 'All';

        const categories = ['All', ...new Set(flashcards.map(card => card.category))];

        function initializeCategoryTags() {
            const tagsContainer = document.getElementById('categoryTags');
            categories.forEach(cat => {
                const tag = document.createElement('span');
                tag.className = 'tag' + (cat === 'All' ? ' active' : '');
                tag.textContent = cat;
                tag.onclick = () => filterByCategory(cat);
                tagsContainer.appendChild(tag);
            });
        }

        function filterByCategory(category) {
            currentCategory = category;
            
            // Update tag styles
            document.querySelectorAll('.tag').forEach(tag => {
                tag.classList.toggle('active', tag.textContent === category);
            });

            if (category === 'All') {
                filteredCards = [...flashcards];
            } else {
                filteredCards = flashcards.filter(card => card.category === category);
            }
            
            currentIndex = 0;
            viewedCards.clear();
            displayCard();
        }

        function displayCard() {
            const card = filteredCards[currentIndex];
            document.getElementById('question').innerHTML = card.question;
            document.getElementById('answer').innerHTML = card.answer;
            document.getElementById('progress').textContent = `${currentIndex + 1} / ${filteredCards.length}`;
            
            viewedCards.add(currentIndex);
            
            // Reset flip
            if (isFlipped) {
                flipCard();
            }

            // Update button states
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === filteredCards.length - 1;
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            card.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function nextCard() {
            if (currentIndex < filteredCards.length - 1) {
                currentIndex++;
                displayCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                displayCard();
            }
        }

        function shuffleCards() {
            for (let i = filteredCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
            }
            currentIndex = 0;
            viewedCards.clear();
            displayCard();
        }

        function resetProgress() {
            currentIndex = 0;
            viewedCards.clear();
            filterByCategory('All');
        }

        function toggleStats() {
            const statsDiv = document.getElementById('stats');
            const isVisible = statsDiv.style.display !== 'none';
            
            if (isVisible) {
                statsDiv.style.display = 'none';
            } else {
                const categoryCounts = {};
                flashcards.forEach(card => {
                    categoryCounts[card.category] = (categoryCounts[card.category] || 0) + 1;
                });

                let statsHTML = `
                    <p><strong>Total Cards:</strong> ${flashcards.length}</p>
                    <p><strong>Current Filter:</strong> ${currentCategory} (${filteredCards.length} cards)</p>
                    <p><strong>Viewed:</strong> ${viewedCards.size} / ${filteredCards.length}</p>
                    <p><strong>Progress:</strong> ${Math.round((viewedCards.size / filteredCards.length) * 100)}%</p>
                    <hr style="margin: 15px 0; border: none; border-top: 1px solid rgba(255,255,255,0.3);">
                    <p><strong>Cards by Category:</strong></p>
                `;

                Object.entries(categoryCounts).sort((a, b) => b[1] - a[1]).forEach(([cat, count]) => {
                    statsHTML += `<p>• ${cat}: ${count} cards</p>`;
                });

                document.getElementById('statsContent').innerHTML = statsHTML;
                statsDiv.style.display = 'block';
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        // Initialize
        initializeCategoryTags();
        displayCard();
    </script>
</body>
</html>
